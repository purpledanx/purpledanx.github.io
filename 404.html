<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found</title>
	<link rel="icon" type="image/x-icon" href="assets/roblox.svg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&family=Oxygen:wght@300;400;700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
	<script src="script.js"></script>
	<style>
		.not-found {
			min-height: calc(100vh - 70px);
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.not-found-card {
			width: min(720px, 100%);
			background: var(--surface);
			border: 1px solid var(--border-soft);
			border-radius: 16px;
			box-shadow: var(--section-shadow);
			padding: 32px;
			text-align: center;
		}

		.not-found-code {
			font-size: clamp(3.2rem, 12vw, 7rem);
			line-height: 1;
			font-weight: 700;
			letter-spacing: 0.05em;
			color: var(--accent-strong);
			margin-bottom: 14px;
		}

		.not-found-title {
			font-size: clamp(1.35rem, 4vw, 2rem);
			color: var(--heading);
			margin-bottom: 10px;
		}

		.not-found-text {
			color: var(--text-muted);
			margin-bottom: 22px;
		}

		.not-found-actions {
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.not-found-home {
			display: inline-block;
			padding: 12px 24px;
			border-radius: 999px;
			text-decoration: none;
			font-weight: 600;
			background: var(--project-btn-bg);
			color: var(--project-btn-text);
			transition: transform 0.2s, background 0.2s;
		}

		.not-found-home:hover {
			background: var(--project-btn-bg-hover);
			transform: translateY(-1px);
		}
	</style>
</head>

<body>
	<nav class="navbar">
		<a href="index.html" class="nav-brand">purpledan</a>
		<div class="nav-actions">
			<a href="index.html#about" class="nav-icon-link" data-tip="About Me" aria-label="Go to About section">
				<span class="material-symbols-outlined">person</span>
			</a>
			<a href="index.html#skills" class="nav-icon-link" data-tip="Skills" aria-label="Go to Skills section">
				<span class="material-symbols-outlined">code</span>
			</a>
			<a href="index.html#projects" class="nav-icon-link" data-tip="Projects" aria-label="Go to Projects section">
				<span class="material-symbols-outlined">deployed_code</span>
			</a>
			<a href="index.html#socials" class="nav-icon-link" data-tip="Connect" aria-label="Go to Connect section">
				<span class="material-symbols-outlined">groups</span>
			</a>
			<button class="dark-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode">🌙</button>
		</div>
	</nav>

	<main class="not-found">
		<section class="not-found-card">
			<p class="not-found-code">404</p>
			<h1 class="not-found-title">Page not found</h1>
			<p class="not-found-text">The page you are looking for does not exist or was moved.</p>
			<div class="not-found-actions">
				<a class="not-found-home" href="index.html">Back to Home</a>
			</div>
		</section>
	</main>
</body>

</html>
